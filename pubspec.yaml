  dio: ^5.8.0+1
  pin_code_fields: ^8.0.1
  dropdown_button2: ^2.3.9
  image_picker: ^1.2.1
  permission_handler: ^12.0.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  dotted_border: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_uae_pass: ^1.1.1
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.2
