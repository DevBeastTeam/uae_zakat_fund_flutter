  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.3.0
  flutter_widget_from_html: ^0.16.0
  flutter_rating_bar: ^4.0.1
  uuid: ^4.5.1
  fl_chart: ^1.0.0
  #pay: ^3.2.1
